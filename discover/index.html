<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임 발견 — DaeMonScript</title><style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI",Arial,"Malgun Gothic",sans-serif;background:#101820;color:#e7edf2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -200px,#31536a,transparent 700px),#101820}a{color:inherit;text-decoration:none}.head{height:76px;background:#0d141b;border-bottom:1px solid #293b49;display:flex;align-items:center;padding:0 max(calc((100% - 1280px)/2),24px);gap:38px;position:sticky;top:0;z-index:5}.logo{font-weight:900;letter-spacing:1.5px;font-size:19px}.logo b{color:#80c9ec}.nav{display:flex;gap:25px;height:100%;align-items:center}.nav a{font-size:12px;color:#b7c6d0;font-weight:700}.nav a:hover,.nav a.active{color:#7bc8ed}.wrap{max-width:1280px;margin:auto;padding:30px 24px 70px}.eyebrow{color:#8acbed;font-size:10px;letter-spacing:2px;font-weight:800}.hero{background:linear-gradient(110deg,#172c3c,#1e4053 65%,#254b60);padding:35px 38px;margin-bottom:28px;display:flex;justify-content:space-between;align-items:center;gap:20px}.hero h1{font-size:35px;margin:10px 0}.hero p{color:#c0d0da;max-width:570px;line-height:1.7;font-size:13px}.hero a,.btn{display:inline-flex;padding:11px 17px;background:#8bcfef;color:#10212c;font-weight:800;font-size:12px;border:0}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.filters button{background:#1b2b38;color:#b8c9d4;border:1px solid #344b5c;padding:9px 14px;cursor:pointer}.filters button.active{background:#315b73;color:white;border-color:#6eb7dc}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#182633;border:1px solid #2b3f4d;min-width:0}.art{height:135px;display:flex;align-items:end;padding:15px;font-size:23px;font-weight:900;background:linear-gradient(135deg,var(--a),var(--b))}.body{padding:13px}.body h3{font-size:14px;margin:0 0 6px}.body p{font-size:11px;color:#9eb0bd;margin:0 0 12px}.meta{display:flex;justify-content:space-between;color:#8fb6ca;font-size:10px}.body a{display:inline-block;margin-top:12px;color:#86ccef;font-size:11px;font-weight:bold}.section{margin:32px 0}.section h2{font-size:17px}.creator{display:flex;align-items:center;justify-content:space-between;gap:20px;background:#172633;border-left:3px solid #83c9ed;padding:20px}.creator p{color:#9eb2c1;font-size:12px}.creator a{background:#314d60;padding:11px 15px;font-size:12px;white-space:nowrap}@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}.head{gap:20px}.nav{gap:14px}}@media(max-width:600px){.head{height:auto;min-height:64px;padding:12px;display:block}.logo{display:inline-block;margin-bottom:10px}.nav{height:auto;overflow:auto;gap:19px}.nav a{white-space:nowrap}.wrap{padding:18px 13px 50px}.hero{padding:22px;display:block}.hero h1{font-size:27px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.art{height:100px;font-size:17px}.creator{display:block}.creator a{display:inline-block;margin-top:8px}}
</style></head><body><header class="head"><a class="logo" href="/">D<span style="color:#8bcfed">AE</span>MONSCRIPT</a><nav class="nav"><a href="/">상점</a><a class="active" href="/discover/">발견</a><a href="/games/">게임 탐색</a><a href="/library/">라이브러리</a><a href="/community/">커뮤니티</a><a href="/create/">제작</a></nav></header><main class="wrap"><section class="hero"><div><span class="eyebrow">DISCOVER EXPERIENCES</span><h1>다음 경험을 발견하세요.</h1><p>아케이드, 퍼즐, 레이싱부터 친구와 함께 즐길 수 있는 게임까지. DaeMonScript의 게임을 탐색하고 나만의 라이브러리에 모아보세요.</p><a href="#experiences">경험 둘러보기 ↓</a></div></section><section id="experiences"><span class="eyebrow">EXPLORE</span><h2>추천 경험</h2><div class="filters" id="filters"><button class="active" data-filter="all">전체</button><button data-filter="아케이드">아케이드</button><button data-filter="퍼즐">퍼즐</button><button data-filter="보드게임">보드게임</button><button data-filter="스포츠">스포츠</button><button data-filter="캐주얼">캐주얼</button></div><div class="grid" id="grid"></div></section><section class="section creator"><div><h2>직접 만든 게임을 세상에 공개하세요.</h2><p>게임 프로젝트를 만들고, 설명과 장르를 정리해 보세요. 제작 도구에서 프로젝트 초안을 관리할 수 있습니다.</p></div><a href="/create/">크리에이터 스튜디오 열기 →</a></section></main><script>
const games=[["snake","스네이크","아케이드","/games/snake/"],["pacman","팩맨","아케이드","/games/pacman/"],["tetris","테트리스","퍼즐","/games/tetris/"],["2048","2048","퍼즐","/games/2048/"],["minesweeper","지뢰 찾기","퍼즐","/games/minesweeper/"],["sudoku","스도쿠","퍼즐","/games/sudoku/"],["tic-tac-toe","틱택토","보드게임","/games/tic-tac-toe/"],["gomoku","오목","보드게임","/games/gomoku/"],["air-hockey","에어 하키","스포츠","/games/air-hockey/"],["mini-golf","미니 골프","스포츠","/games/mini-golf/"],["cookieclicker","쿠키 클릭커","캐주얼","/games/cookieclicker/"],["reaction","반응 속도 테스트","캐주얼","/games/reaction/"],["polytrack","폴리트랙","레이싱","/games/polytrack/"],["geometrydash","지오메트리 대시","리듬","/games/geometrydash/"],["wordle","워들","단어","/games/wordle/"],["connect-four","커넥트 포","보드게임","/games/connect-four/"]];
const root=document.getElementById('grid');let filter='all';function draw(){root.replaceChildren();games.filter(g=>filter==='all'||g[2]===filter).forEach((g,i)=>{const el=document.createElement('article');el.className='card';const art=document.createElement('div');art.className='art';art.style.setProperty('--a','hsl('+(i*37%360)+' 45% 42%)');art.style.setProperty('--b','hsl('+(i*37%360+48)+' 48% 17%)');art.textContent=g[1].toUpperCase();const body=document.createElement('div');body.className='body';const h=document.createElement('h3');h.textContent=g[1];const p=document.createElement('p');p.textContent=g[2]+' · 브라우저 게임';const meta=document.createElement('div');meta.className='meta';meta.textContent='무료 플레이';const a=document.createElement('a');a.href=g[3];a.textContent='지금 플레이 →';body.append(h,p,meta,a);el.append(art,body);root.append(el)})}document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));draw()}));draw();
</script></body></html>
