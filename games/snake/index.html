<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b13"><title>Snake — DaeMonScript Games</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090b13;color:#f4f5fb;display:grid;place-items:center;padding:18px}.wrap{width:min(560px,100%)}a{color:#b9aaff;text-decoration:none;font-size:12px}.head{display:flex;justify-content:space-between;align-items:center;margin:18px 0}.head h1{font-size:25px;margin:0}.stats{display:flex;gap:10px}.stat{background:#151a29;border:1px solid #293149;padding:9px 13px;border-radius:10px;font-size:11px;color:#aab2c7}.stat b{color:white;font-size:15px;margin-left:6px}canvas{width:100%;aspect-ratio:1;background:#0d1420;border:1px solid #303b55;border-radius:15px;display:block;touch-action:none}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:14px;align-items:center}.btn{background:#9a83ff;color:#0b0b15;border:0;border-radius:9px;padding:11px 16px;font-weight:800}.hint{font-size:11px;color:#9ba4bb;line-height:1.6}.pad{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(2,34px);gap:4px}.pad button{background:#1a2031;border:1px solid #303b55;border-radius:7px;color:white}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}.overlay{margin-top:10px;color:#9ba4bb;font-size:11px;text-align:center}@media(min-width:700px){.pad{display:none}}
/* DaeMonScript unified game shell */
.dms-globalbar{position:fixed;z-index:1000;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:22px;padding:0 clamp(14px,3vw,36px);background:rgba(8,12,22,.97);border-bottom:1px solid #29334a;color:#eef2ff;font:600 12px/1 Inter,system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.dms-brand{display:flex;align-items:center;gap:9px;color:#f5f7ff;text-decoration:none;font-weight:900;letter-spacing:.12em;white-space:nowrap}
.dms-mark{display:grid;place-items:center;width:25px;height:25px;background:#8b78ff;color:#090b13;font-size:12px;font-weight:1000}
.dms-crumb{color:#7f8ba5;white-space:nowrap}.dms-crumb strong{color:#e9ecf8;font-weight:700}
.dms-globalbar .dms-back{margin-left:auto;color:#c5baff;text-decoration:none;border:1px solid #343c55;padding:9px 12px;white-space:nowrap}
.dms-globalbar .dms-back:hover{background:#8b78ff;color:#080b14;border-color:#8b78ff}
body{padding-top:74px!important}
@media(max-width:520px){.dms-globalbar{height:50px;gap:10px;padding:0 12px}.dms-brand{font-size:10px}.dms-crumb{font-size:10px}.dms-globalbar .dms-back{padding:8px;font-size:10px}body{padding-top:64px!important}}

</style></head><body>
<nav class="dms-globalbar" aria-label="DaeMonScript game navigation"><a class="dms-brand" href="/"><span class="dms-mark">D</span> DAEMONSCRIPT</a><span class="dms-crumb">GAMES&nbsp; / &nbsp;<strong>Snake</strong></span><a class="dms-back" href="/games/">ALL GAMES&nbsp; ↗</a></nav><main class="wrap"><a href="/games/">← ALL GAMES</a><div class="head"><h1>Snake</h1><div class="stats"><div class="stat">SCORE<b id="score">0</b></div><div class="stat">BEST<b id="best">0</b></div></div></div><canvas id="game" width="480" height="480" aria-label="Snake game board"></canvas><div class="controls"><div><button class="btn" id="start">START GAME</button><p class="hint">Move with arrow keys or WASD.<br>On mobile, use the direction pad.</p></div><div class="pad" aria-label="Touch controls"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div><p class="overlay" id="message">Press Start to play. Avoid the walls and your own tail.</p></main><script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),message=document.getElementById('message'),start=document.getElementById('start'),N=24,C=20;let snake,dir,next,food,score,best=Number(localStorage.getItem('dms-snake-best')||0),timer=null,running=false;bestEl.textContent=best;
function reset(){snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];dir={x:1,y:0};next=dir;score=0;scoreEl.textContent='0';food=spawn();draw()}
function spawn(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p}
function draw(){ctx.fillStyle='#0d1420';ctx.fillRect(0,0,480,480);ctx.strokeStyle='#ffffff08';for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,480);ctx.moveTo(0,i*C);ctx.lineTo(480,i*C);ctx.stroke()}ctx.fillStyle='#ff8b9c';ctx.beginPath();ctx.arc(food.x*C+10,food.y*C+10,7,0,Math.PI*2);ctx.fill();snake.forEach((s,i)=>{ctx.fillStyle=i?'#42b99b':'#8bf0cf';ctx.beginPath();ctx.roundRect(s.x*C+2,s.y*C+2,C-4,C-4,5);ctx.fill()})}
function stop(msg){running=false;clearInterval(timer);timer=null;start.textContent='PLAY AGAIN';message.textContent=msg}
function tick(){dir=next;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const eating=head.x===food.x&&head.y===food.y;const body=eating?snake:snake.slice(0,-1);if(head.x<0||head.y<0||head.x>=N||head.y>=N||body.some(s=>s.x===head.x&&s.y===head.y)){stop('Game over. Your score: '+score+'. Press Play Again to retry.');return}snake.unshift(head);if(eating){score+=10;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('dms-snake-best',best)}food=spawn()}else snake.pop();draw()}
function change(d){if(d.x!==-dir.x||d.y!==-dir.y)next=d}
function begin(){clearInterval(timer);reset();running=true;start.textContent='RESTART';message.textContent='Game running — good luck!';timer=setInterval(tick,115)}
document.addEventListener('keydown',e=>{const map={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0}};const d=map[e.key]||map[e.key.toLowerCase()];if(d){e.preventDefault();change(d)}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};change(map[b.dataset.dir])}));start.addEventListener('click',begin);reset();
})();
</script></body></html>
