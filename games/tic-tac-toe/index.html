<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b13"><title>Tic Tac Toe — DaeMonScript Games</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#30265b55,transparent 40%),#090b13;color:#f4f5fb;display:grid;place-items:center;padding:20px}.wrap{width:min(470px,100%)}a{color:#b9aaff;text-decoration:none;font-size:12px}.top{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.top h1{margin:0;font-size:25px}.score{display:flex;gap:8px}.pill{padding:9px 12px;background:#151a29;border:1px solid #293149;border-radius:9px;font-size:11px;color:#aab2c7}.pill b{color:white;margin-left:5px}.status{text-align:center;color:#c5bbff;font-size:13px;margin:22px 0}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{aspect-ratio:1;border:1px solid #343b59;border-radius:15px;background:linear-gradient(145deg,#191d31,#111726);font-size:clamp(45px,13vw,68px);font-weight:800;color:#b9aaff}.cell:disabled{cursor:default}.cell.x{color:#75d9ca}.cell.o{color:#b9aaff}.actions{display:flex;justify-content:center;gap:10px;margin-top:22px}.btn{border:0;border-radius:9px;padding:11px 17px;background:#9a83ff;color:#0b0b15;font-weight:800}.secondary{background:#1a2031;border:1px solid #303b55;color:#e5e4f2}.note{text-align:center;color:#78839c;font-size:11px;line-height:1.6;margin-top:20px}
/* DaeMonScript unified game shell */
.dms-globalbar{position:fixed;z-index:1000;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:22px;padding:0 clamp(14px,3vw,36px);background:rgba(8,12,22,.97);border-bottom:1px solid #29334a;color:#eef2ff;font:600 12px/1 Inter,system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.dms-brand{display:flex;align-items:center;gap:9px;color:#f5f7ff;text-decoration:none;font-weight:900;letter-spacing:.12em;white-space:nowrap}
.dms-mark{display:grid;place-items:center;width:25px;height:25px;background:#8b78ff;color:#090b13;font-size:12px;font-weight:1000}
.dms-crumb{color:#7f8ba5;white-space:nowrap}.dms-crumb strong{color:#e9ecf8;font-weight:700}
.dms-globalbar .dms-back{margin-left:auto;color:#c5baff;text-decoration:none;border:1px solid #343c55;padding:9px 12px;white-space:nowrap}
.dms-globalbar .dms-back:hover{background:#8b78ff;color:#080b14;border-color:#8b78ff}
body{padding-top:74px!important}
@media(max-width:520px){.dms-globalbar{height:50px;gap:10px;padding:0 12px}.dms-brand{font-size:10px}.dms-crumb{font-size:10px}.dms-globalbar .dms-back{padding:8px;font-size:10px}body{padding-top:64px!important}}

</style></head><body>
<nav class="dms-globalbar" aria-label="DaeMonScript game navigation"><a class="dms-brand" href="/"><span class="dms-mark">D</span> DAEMONSCRIPT</a><span class="dms-crumb">GAMES&nbsp; / &nbsp;<strong>Tic Tac Toe</strong></span><a class="dms-back" href="/games/">ALL GAMES&nbsp; ↗</a></nav><main class="wrap"><a href="/games/">← ALL GAMES</a><div class="top"><h1>Tic Tac Toe</h1><div class="score"><span class="pill">X <b id="xs">0</b></span><span class="pill">O <b id="os">0</b></span></div></div><p class="status" id="status" aria-live="polite">Player X's turn</p><div class="board" id="board" aria-label="Tic Tac Toe board"><button class="cell" data-cell="0" aria-label="Cell 1"></button><button class="cell" data-cell="1" aria-label="Cell 2"></button><button class="cell" data-cell="2" aria-label="Cell 3"></button><button class="cell" data-cell="3" aria-label="Cell 4"></button><button class="cell" data-cell="4" aria-label="Cell 5"></button><button class="cell" data-cell="5" aria-label="Cell 6"></button><button class="cell" data-cell="6" aria-label="Cell 7"></button><button class="cell" data-cell="7" aria-label="Cell 8"></button><button class="cell" data-cell="8" aria-label="Cell 9"></button></div><div class="actions"><button class="btn" id="restart">New round</button><button class="btn secondary" id="reset">Reset scores</button></div><p class="note">Local two-player mode · Take turns on the same device.<br>Online rooms and friend invites are planned for a future update.</p></main><script>
(()=>{const cells=[...document.querySelectorAll('[data-cell]')],status=document.getElementById('status');let board=Array(9).fill(''),turn='X',over=false,scores={X:0,O:0};const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function render(){cells.forEach((c,i)=>{c.textContent=board[i];c.className='cell '+(board[i]?board[i].toLowerCase():'');c.disabled=over||!!board[i]});document.getElementById('xs').textContent=scores.X;document.getElementById('os').textContent=scores.O}function play(i){if(over||board[i])return;board[i]=turn;const won=wins.some(line=>line.every(n=>board[n]===turn));if(won){over=true;scores[turn]++;status.textContent='Player '+turn+' wins this round!'}else if(board.every(Boolean)){over=true;status.textContent="It's a draw!"}else{turn=turn==='X'?'O':'X';status.textContent="Player "+turn+"'s turn"}render()}function fresh(){board=Array(9).fill('');turn='X';over=false;status.textContent="Player X's turn";render()}cells.forEach((c,i)=>c.addEventListener('click',()=>play(i)));document.getElementById('restart').addEventListener('click',fresh);document.getElementById('reset').addEventListener('click',()=>{scores={X:0,O:0};fresh()});render()})();
</script></body></html>
