nt-size:12px}.tabs a.active{color:#fff;border-bottom:3px solid var(--blue)}.grid{display:grid;grid-template-columns:2fr 1fr;gap:12px}.panel{background:var(--panel);border:1px solid #1e2b39;padding:17px}.panel h2{font-size:14px;margin:0 0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#1b2a38;padding:15px}.stat small{display:block;color:#94a9bb;font-size:11px;margin-bottom:8px}.stat strong{font-size:22px;color:#fff}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}.links a{background:#1b2a38;padding:14px;color:#bcd4e4}.links a:hover{background:#263e52;color:#fff}.muted{font-size:12px;color:#8ea4b7;line-height:1.7}.status{margin-top:12px;color:#a9d17b;font-size:12px;min-height:18px}@media(max-width:650px){.top{height:70px}.topin{padding:0 13px;gap:18px}.logo{font-size:18px}.nav{gap:12px;overflow:auto}.nav a{font-size:11px;white-space:nowrap}.account>button{font-size:10px;padding:8px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:10px}.stat strong{font-size:18px}.links{grid-template-columns:1fr 1fr}.wrap{margin-top:16px}.banner{padding:16px}.banner h1{font-size:19px}}

<main class="wrap"><section class="banner"><div class="avatar" id="avatar">?</div><div><h1 id="nickname">내 프로필</h1><p id="email">계정 정보를 불러오는 중입니다.</p></div></section><nav class="tabs"><a class="active" href="/account/">프로필</a><a href="/account/games/">게임</a><a href="/account/?tab=friends">친구</a><a href="/account/?tab=content">콘텐츠</a><a href="/account/?tab=badges">배지</a></nav><div class="grid"><section class="panel"><h2>계정 활동</h2><div class="stats"><div class="stat"><small>라이브러리 게임</small><strong id="gameCount">0</strong></div><div class="stat"><small>최근 플레이</small><strong id="recentCount">0</strong></div><div class="stat"><small>계정 상태</small><strong id="accountState">-</strong></div></div><p class="status" id="status"></p></section><aside class="panel"><h2>빠른 이동</h2><div class="links"><a href="/account/games/">내 게임 목록 →</a><a href="/library/">게임 실행 →</a><a href="/community/">커뮤니티 →</a><a href="/account/?tab=friends">친구 관리 →</a></div></aside></div><section class="panel" style="margin-top:12px"><h2 id="sectionTitle">프로필 소개</h2><p class="muted" id="sectionText">DaeMonScript Gaming 프로필입니다. 라이브러리에 게임을 추가하면 이곳에서 보유 게임을 확인할 수 있습니다.</p></section></main>
<script>(()=>{const API='https://daemonscript-gaming-auth.youthdeveloper-github.workers.dev',token=()=>sessionStorage.getItem('dms-auth-token')||localStorage.getItem('dms-auth-token'),$=id=>document.getElementById(id);const labels={activity:['최근 활동','최근 플레이한 게임과 플랫폼 활동을 확인합니다.'],friends:['친구','친구 기능은 계정 간 친구 요청 API 연결 후 활성화됩니다.'],groups:['그룹','그룹 기능은 추후 연결됩니다.'],content:['콘텐츠','작성한 가이드와 커뮤니티 콘텐츠를 모아보는 공간입니다.'],badges:['배지','게임 활동에 따라 획득한 배지를 표시합니다.'],storage:['보관함','저장한 게임과 콘텐츠를 확인합니다.'],recap:['DaeMonScript 돌아보기','나의 게임 활동을 요약하는 공간입니다.']};async function start(){if(!token()){ $('nickname').textContent='로그인이 필요합니다';$('email').textContent='계정 메뉴를 사용하려면 먼저 로그인해 주세요.';$('accountState').textContent='비로그인';$('status').innerHTML='<a href="/account/login.html" style="color:#66c0f4">로그인 또는 회원가입 →</a>';return}try{const r=await fetch(API+'/api/auth/me',{headers:{Authorization:'Bearer '+token()}});if(!r.ok)throw Error('인증 정보를 확인할 수 없습니다.');const d=await r.json();$('nickname').textContent=d.user.nickname;$('avatar').textContent=(d.user.nickname||'?').slice(0,1).toUpperCase();$('email').textContent=d.user.email||'DaeMonScript 회원';$('accountState').textContent='정상';let games=[];try{const x=await fetch(API+'/api/library',{headers:{Authorization:'Bearer '+token()}});if(x.ok){const y=await x.json();games=Array.isArray(y.games)?y.games:[]}}catch{}const local=JSON.parse(localStorage.getItem('dms-gaming-library')||'[]');games=[...new Set([...games,...(Array.isArray(local)?local:[])])];$('gameCount').textContent=games.length;$('recentCount').textContent='-';$('status').textContent='계정에 정상적으로 연결되었습니다.'}catch(e){$('status').textContent=e.message;$('accountState').textContent='확인 필요'}}const tab=new URLSearchParams(location.search).get('tab');if(tab&&labels[tab]){$('sectionTitle').textContent=labels[tab][0];$('sectionText').textContent=labels[tab][1];document.querySelectorAll('.tabs a').forEach(a=>a.classList.remove('active'))} $('accountButton').addEventListener('click',()=> $('account').classList.toggle('open'));start()})();</script></body></html>
