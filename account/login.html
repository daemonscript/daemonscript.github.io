<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171a21"><title>계정 로그인 — DaeMonScript Gaming</title>
<style>
:root{color-scheme:dark;--bg:#171a21;--panel:#1b2838;--line:#34495b;--text:#e5edf4;--muted:#91a0ae;--blue:#66c0f4;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#294a62 0,transparent 620px),var(--bg);color:var(--text);display:flex;flex-direction:column}.top{height:66px;background:#111820;border-bottom:1px solid #293b4a;display:flex;align-items:center;padding:0 max(22px,calc((100% - 1120px)/2));justify-content:space-between}.brand{font-size:16px;font-weight:800;letter-spacing:1.6px;color:#fff;text-decoration:none}.brand span{color:var(--blue)}.top a:last-child{font-size:12px;color:#a9c9dd;text-decoration:none}.main{width:min(440px,calc(100% - 28px));margin:62px auto}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--blue);font-weight:bold}.heading{font-size:29px;font-weight:500;margin:12px 0 7px}.sub{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 24px}.panel{background:linear-gradient(145deg,#1d2b3b,#172331);border:1px solid #34495b;padding:25px;box-shadow:0 18px 55px #0005}.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #34495b;margin:-2px 0 22px}.tabs button{border:0;border-bottom:2px solid transparent;background:none;color:#8799a8;padding:12px;cursor:pointer;font-size:12px}.tabs button.active{color:#fff;border-color:var(--blue)}label{display:block;font-size:11px;color:#c7d4de;margin:0 0 8px}.field{margin:0 0 17px}.field input{width:100%;height:43px;background:#101a25;border:1px solid #3a5063;color:#fff;padding:0 12px;outline:none;border-radius:2px}.field input:focus{border-color:var(--blue)}.row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#9eafbc;margin:4px 0 19px}.row label{display:flex;align-items:center;gap:7px;margin:0}.row input{accent-color:#66c0f4}.row span{color:#8297a7}.submit{width:100%;height:44px;border:0;background:linear-gradient(90deg,#5f9fca,#75c8ed);color:#10202b;font-weight:800;letter-spacing:.5px;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.secondary{width:100%;height:38px;margin-top:9px;border:1px solid #496477;background:#203344;color:#bcd2e0;cursor:pointer;font-size:11px}.notice{margin-top:18px;padding:12px;background:#192b38;border-left:3px solid #66c0f4;color:#afc5d4;font-size:11px;line-height:1.6}.status{min-height:18px;margin:12px 0 0;font-size:11px;color:#e7c778;line-height:1.6}.status.error{color:#f29c91}.status.success{color:#a9d17b}.foot{text-align:center;color:#748695;font-size:10px;line-height:1.7;margin:20px 0}.foot a{color:#a9c9dd;text-decoration:none}@media(max-width:520px){.main{margin:35px auto}.panel{padding:19px}.heading{font-size:25px}}
</style></head><body><header class="top"><a class="brand" href="/">DAEMON<span>SCRIPT</span></a><a href="/">스토어로 돌아가기 ←</a></header><main class="main"><div class="eyebrow">DAEMONSCRIPT GAMING ACCOUNT</div><h1 class="heading" id="heading">다시 만나서 반갑습니다.</h1><p class="sub">로그인하면 게임 라이브러리와 플레이 기록을 계정에 연결할 수 있습니다.</p><section class="panel"><div class="tabs"><button class="active" id="loginTab" type="button">로그인</button><button id="signupTab" type="button">회원가입</button></div><form id="accountForm"><div class="field" id="nicknameField" hidden><label for="nickname">닉네임</label><input id="nickname" autocomplete="nickname" maxlength="24" minlength="2" placeholder="게임에서 사용할 닉네임"></div><div class="field"><label for="email">이메일</label><input id="email" type="email" autocomplete="email" maxlength="254" placeholder="name@example.com" required></div><div class="field"><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" placeholder="8자 이상" required></div><div class="row"><label><input type="checkbox" id="remember"> 로그인 상태 유지</label><span>비밀번호 8자 이상</span></div><button class="submit" id="submit" type="submit">로그인</button><button class="secondary" id="logout" type="button" hidden>로그아웃</button><p class="status" id="status" role="status"></p></form><div class="notice">실제 계정 인증이 연결되어 있습니다. 비밀번호는 서버에서 PBKDF2 방식으로 처리되며 원문으로 저장되지 않습니다. 로그인 토큰은 선택한 로그인 유지 방식에 따라 이 브라우저에 저장됩니다.</div></section><p class="foot">계정 데이터는 게임 서비스 제공을 위해 사용됩니다.<br><a href="/">DaeMonScript Gaming</a></p></main>
<script>
(()=>{const API="https://daemonscript-gaming-auth.youthdeveloper-github.workers.dev";let mode="login";const $=id=>document.getElementById(id);const token=()=>sessionStorage.getItem("dms-auth-token")||localStorage.getItem("dms-auth-token");function message(text,type=""){ $("status").textContent=text;$("status").className="status "+type }function setMode(next){mode=next;const signup=mode==="signup";$("loginTab").classList.toggle("active",!signup);$("signupTab").classList.toggle("active",signup);$("nicknameField").hidden=!signup;$("nickname").required=signup;$("heading").textContent=signup?"새 계정을 만들어 보세요.":"다시 만나서 반갑습니다.";$("password").autocomplete=signup?"new-password":"current-password";$("submit").textContent=signup?"회원가입":"로그인";message("")}async function api(path,options={}){const headers={"Content-Type":"application/json",...(options.headers||{})};if(token())headers.Authorization="Bearer "+token();const response=await fetch(API+path,{...options,headers});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error||"요청을 처리하지 못했습니다.");return data}function storeToken(t,remember){sessionStorage.removeItem("dms-auth-token");localStorage.removeItem("dms-auth-token");(remember?localStorage:sessionStorage).setItem("dms-auth-token",t)}$("loginTab").onclick=()=>setMode("login");$("signupTab").onclick=()=>setMode("signup");$("accountForm").addEventListener("submit",async e=>{e.preventDefault();$("submit").disabled=true;message(mode==="signup"?"계정을 생성하고 있습니다.":"로그인 중입니다.");try{const payload={email:$("email").value.trim(),password:$("password").value};if(mode==="signup")payload.nickname=$("nickname").value.trim();const result=await api(mode==="signup"?"/api/auth/register":"/api/auth/login",{method:"POST",body:JSON.stringify(payload)});storeToken(result.token,$("remember").checked);message(result.user.nickname+"님, 로그인되었습니다. 라이브러리로 이동합니다.","success");$("logout").hidden=false;setTimeout(()=>location.href="/library/",700)}catch(err){message(err.message,"error")}finally{$("submit").disabled=false}});$("logout").onclick=async()=>{try{await api("/api/auth/logout",{method:"POST",body:"{}"})}catch{}sessionStorage.removeItem("dms-auth-token");localStorage.removeItem("dms-auth-token");$("logout").hidden=true;message("로그아웃되었습니다.","success")};async function check(){if(!token())return;try{const data=await api("/api/auth/me");$("logout").hidden=false;message(data.user.nickname+"님, 이미 로그인되어 있습니다.","success")}catch{sessionStorage.removeItem("dms-auth-token");localStorage.removeItem("dms-auth-token")}}check()})();
</script></body></html>
