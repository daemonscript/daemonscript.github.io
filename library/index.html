<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171a21"><title>Library — DaeMonScript Gaming</title><style>
:root{color-scheme:dark;--bg:#171a21;--panel:#1b2838;--line:#2b4054;--text:#dfe3e6;--muted:#91a0ae;--blue:#66c0f4;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#24415a 0,transparent 500px),var(--bg);color:var(--text)}a{color:inherit;text-decoration:none}.top{background:#171d25;border-bottom:1px solid #263747}.topin{max-width:1000px;margin:auto;padding:22px;display:flex;justify-content:space-between}.top a{color:var(--blue)}main{max-width:1000px;margin:auto;padding:36px 22px 80px}.tabs{display:flex;gap:20px;background:#31536a;padding:13px;font-size:12px;color:#d5e8f3}.title{font-size:26px;font-weight:400;margin:28px 0 7px}.desc{font-size:12px;color:var(--muted)}.row{display:grid;grid-template-columns:170px 1fr auto;align-items:center;gap:15px;background:var(--panel);padding:12px;margin-top:10px}.art{height:88px;display:flex;align-items:end;padding:10px;font-size:17px;font-weight:bold;background:linear-gradient(130deg,#1a594e,#102333)}.art.purple{background:linear-gradient(130deg,#4d3b82,#182b49)}.row h2{font-size:14px;font-weight:500;margin:0 0 6px}.row p{font-size:11px;color:var(--muted);margin:0}.actions{display:flex;gap:7px}.btn{border:0;background:#75ad39;color:#17210e;padding:9px 11px;font-size:11px;font-weight:bold}.remove{background:#30495d;color:#c5d7e2}.empty{margin-top:20px;padding:35px;text-align:center;background:#1b2838;color:var(--muted);font-size:12px}.foot{font-size:10px;color:#758694;margin-top:18px;line-height:1.6}@media(max-width:620px){main{padding:20px 13px}.row{grid-template-columns:95px 1fr;gap:10px}.art{height:78px;font-size:12px}.actions{grid-column:2}.title{font-size:22px}}
</style></head><body><header class="top"><div class="topin"><a href="/">← DaeMonScript Gaming</a><span>YOUR LIBRARY</span></div></header><main><nav class="tabs"><a href="/">Store</a><a href="/games/">Browse</a><a href="/library/">Library</a></nav><h1 class="title">My game library</h1><p class="desc">Games you have saved on this device.</p><section id="list"></section><p class="foot">Signed-in users can sync saved games across devices. <span id="syncStatus">현재 브라우저에 저장된 라이브러리입니다.</span></p></main><script>
(()=>{const catalog=[{"id":"2048","name":"2048","genre":"Puzzle","url":"/games/2048/"},{"id":"air-hockey","name":"Air Hockey","genre":"Sports","url":"/games/air-hockey/"},{"id":"ant-flap","name":"Ant Flap","genre":"Arcade","url":"/games/ant-flap/"},{"id":"ant-jump","name":"Ant Jump","genre":"Platformer","url":"/games/ant-jump/"},{"id":"balloon-pop","name":"Balloon Pop","genre":"Casual","url":"/games/balloon-pop/"},{"id":"block-drop","name":"Block Drop","genre":"Puzzle","url":"/games/block-drop/"},{"id":"bowling","name":"Bowling","genre":"Sports","url":"/games/bowling/"},{"id":"breakout","name":"Breakout","genre":"Arcade","url":"/games/breakout/"},{"id":"bubble-shooter","name":"Bubble Shooter","genre":"Puzzle","url":"/games/bubble-shooter/"},{"id":"checkers","name":"Checkers","genre":"Board","url":"/games/checkers/"},{"id":"connect-four","name":"Connect Four","genre":"Board","url":"/games/connect-four/"},{"id":"cross-road","name":"Cross Road","genre":"Arcade","url":"/games/cross-road/"},{"id":"dino-run","name":"Dino Run","genre":"Runner","url":"/games/dino-run/"},{"id":"gem-match","name":"Gem Match","genre":"Puzzle","url":"/games/gem-match/"},{"id":"gomoku","name":"Gomoku","genre":"Board","url":"/games/gomoku/"},{"id":"hanoi","name":"Tower of Hanoi","genre":"Puzzle","url":"/games/hanoi/"},{"id":"helicopter","name":"Helicopter","genre":"Arcade","url":"/games/helicopter/"},{"id":"helix-drop","name":"Helix Drop","genre":"Arcade","url":"/games/helix-drop/"},{"id":"hoop-shot","name":"Hoop Shot","genre":"Sports","url":"/games/hoop-shot/"},{"id":"lights-out","name":"Lights Out","genre":"Puzzle","url":"/games/lights-out/"},{"id":"mahjong-link","name":"Mahjong Link","genre":"Puzzle","url":"/games/mahjong-link/"},{"id":"mancala","name":"Mancala","genre":"Board","url":"/games/mancala/"},{"id":"maze-muncher","name":"Maze Muncher","genre":"Arcade","url":"/games/maze-muncher/"},{"id":"memory-match","name":"Memory Match","genre":"Puzzle","url":"/games/memory-match/"},{"id":"merge-drop","name":"Merge Drop","genre":"Puzzle","url":"/games/merge-drop/"},{"id":"minesweeper","name":"Minesweeper","genre":"Puzzle","url":"/games/minesweeper/"},{"id":"mini-golf","name":"Mini Golf","genre":"Sports","url":"/games/mini-golf/"},{"id":"nonogram","name":"Nonogram","genre":"Puzzle","url":"/games/nonogram/"},{"id":"paddle-duel","name":"Paddle Duel","genre":"Arcade","url":"/games/paddle-duel/"},{"id":"penalty-kick","name":"Penalty Kick","genre":"Sports","url":"/games/penalty-kick/"},{"id":"piano-tap","name":"Piano Tap","genre":"Music","url":"/games/piano-tap/"},{"id":"pipe-connect","name":"Pipe Connect","genre":"Puzzle","url":"/games/pipe-connect/"},{"id":"reversi","name":"Reversi","genre":"Board","url":"/games/reversi/"},{"id":"rush-hour","name":"Rush Hour","genre":"Puzzle","url":"/games/rush-hour/"},{"id":"simon-says","name":"Simon Says","genre":"Memory","url":"/games/simon-says/"},{"id":"slide-puzzle","name":"Slide Puzzle","genre":"Puzzle","url":"/games/slide-puzzle/"},{"id":"snakes-ladders","name":"Snakes & Ladders","genre":"Board","url":"/games/snakes-ladders/"},{"id":"sokoban","name":"Sokoban","genre":"Puzzle","url":"/games/sokoban/"},{"id":"stack-tower","name":"Stack Tower","genre":"Arcade","url":"/games/stack-tower/"},{"id":"sudoku","name":"Sudoku","genre":"Puzzle","url":"/games/sudoku/"},{"id":"water-sort","name":"Water Sort","genre":"Puzzle","url":"/games/water-sort/"},{"id":"whack-a-mole","name":"Whack-a-Mole","genre":"Arcade","url":"/games/whack-a-mole/"},{"id":"cookieclicker","name":"Cookie Clicker","genre":"Casual","url":"/games/cookieclicker/"},{"id":"doodlejump","name":"Doodle Jump","genre":"Platformer","url":"/games/doodlejump/"},{"id":"flappy","name":"Flappy Bird","genre":"Arcade","url":"/games/flappy/"},{"id":"geometrydash","name":"Geometry Dash","genre":"Rhythm","url":"/games/geometrydash/"},{"id":"pacman","name":"Pac-Man","genre":"Arcade","url":"/games/pacman/"},{"id":"polytrack","name":"PolyTrack","genre":"Racing","url":"/games/polytrack/"},{"id":"pong","name":"Pong","genre":"Arcade","url":"/games/pong/"},{"id":"reaction","name":"Reaction Test","genre":"Casual","url":"/games/reaction/"},{"id":"run3","name":"Run 3","genre":"Platformer","url":"/games/run3/"},{"id":"simon","name":"Simon","genre":"Memory","url":"/games/simon/"},{"id":"slither","name":"Slither","genre":"Arcade","url":"/games/slither/"},{"id":"slope","name":"Slope","genre":"Arcade","url":"/games/slope/"},{"id":"stack","name":"Stack","genre":"Arcade","url":"/games/stack/"},{"id":"tetris","name":"Tetris","genre":"Puzzle","url":"/games/tetris/"},{"id":"wordle","name":"Wordle","genre":"Word","url":"/games/wordle/"},{"id":"snake","name":"Snake","genre":"Arcade","url":"/games/snake/"},{"id":"tic-tac-toe","name":"Tic Tac Toe","genre":"Board","url":"/games/tic-tac-toe/"}];const list=document.getElementById('list');let ids=[];try{ids=JSON.parse(localStorage.getItem('dms-gaming-library')||'[]')}catch{}if(!Array.isArray(ids))ids=[];function render(){const games=catalog.filter(g=>ids.includes(g.id));list.replaceChildren();if(!games.length){const empty=document.createElement('div');empty.className='empty';empty.append('Your library is empty. ');const a=document.createElement('a');a.href='/games/';a.textContent='Browse the store and add a game →';a.style.color='#66c0f4';empty.append(a);list.append(empty);return}games.forEach(g=>{const row=document.createElement('article');row.className='row';const art=document.createElement('div');art.className='art';art.textContent=g.name;const info=document.createElement('div');const h=document.createElement('h2');h.textContent=g.name;const p=document.createElement('p');p.textContent=g.genre;info.append(h,p);const actions=document.createElement('div');actions.className='actions';const play=document.createElement('a');play.className='btn';play.href=g.url;play.textContent='PLAY';const remove=document.createElement('button');remove.className='btn remove';remove.textContent='REMOVE';remove.addEventListener('click',()=>{ids=ids.filter(x=>x!==g.id);localStorage.setItem('dms-gaming-library',JSON.stringify(ids));render();syncAccount()});actions.append(play,remove);row.append(art,info,actions);list.append(row)})}async function syncAccount(){const status=document.getElementById('syncStatus');const token=sessionStorage.getItem('dms-auth-token')||localStorage.getItem('dms-auth-token');if(!token)return;const api='https://daemonscript-gaming-auth.youthdeveloper-github.workers.dev';try{const headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};const remote=await fetch(api+'/api/library',{headers});if(!remote.ok)throw new Error('로그인 상태를 확인해 주세요.');const data=await remote.json();const merged=[...new Set([...ids,...(Array.isArray(data.games)?data.games:[])])];const saved=await fetch(api+'/api/library',{method:'PUT',headers,body:JSON.stringify({games:merged})});if(!saved.ok)throw new Error('동기화에 실패했습니다.');ids=merged;localStorage.setItem('dms-gaming-library',JSON.stringify(ids));render();if(status)status.textContent='계정 라이브러리와 동기화되었습니다.'}catch(e){if(status)status.textContent=e.message}};render();syncAccount()})();
</script></body></html>
