<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171a21"><title>Library — DaeMonScript Gaming</title><style>
:root{color-scheme:dark;--bg:#171a21;--panel:#1b2838;--line:#2b4054;--text:#dfe3e6;--muted:#91a0ae;--blue:#66c0f4;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#24415a 0,transparent 500px),var(--bg);color:var(--text)}a{color:inherit;text-decoration:none}.top{background:#171d25;border-bottom:1px solid #263747}.topin{max-width:1000px;margin:auto;padding:22px;display:flex;justify-content:space-between}.top a{color:var(--blue)}main{max-width:1000px;margin:auto;padding:36px 22px 80px}.tabs{display:flex;gap:20px;background:#31536a;padding:13px;font-size:12px;color:#d5e8f3}.title{font-size:26px;font-weight:400;margin:28px 0 7px}.desc{font-size:12px;color:var(--muted)}.row{display:grid;grid-template-columns:170px 1fr auto;align-items:center;gap:15px;background:var(--panel);padding:12px;margin-top:10px}.art{height:88px;display:flex;align-items:end;padding:10px;font-size:17px;font-weight:bold;background:linear-gradient(130deg,#1a594e,#102333)}.art.purple{background:linear-gradient(130deg,#4d3b82,#182b49)}.row h2{font-size:14px;font-weight:500;margin:0 0 6px}.row p{font-size:11px;color:var(--muted);margin:0}.actions{display:flex;gap:7px}.btn{border:0;background:#75ad39;color:#17210e;padding:9px 11px;font-size:11px;font-weight:bold}.remove{background:#30495d;color:#c5d7e2}.empty{margin-top:20px;padding:35px;text-align:center;background:#1b2838;color:var(--muted);font-size:12px}.foot{font-size:10px;color:#758694;margin-top:18px;line-height:1.6}@media(max-width:620px){main{padding:20px 13px}.row{grid-template-columns:95px 1fr;gap:10px}.art{height:78px;font-size:12px}.actions{grid-column:2}.title{font-size:22px}}
</style></head><body><header class="top"><div class="topin"><a href="/">← DaeMonScript Gaming</a><span>YOUR LIBRARY</span></div></header><main><nav class="tabs"><a href="/">Store</a><a href="/games/">Browse</a><a href="/library/">Library</a></nav><h1 class="title">My game library</h1><p class="desc">Games you have saved on this device.</p><section id="list"></section><p class="foot">Your library is currently stored in this browser only. Sign-in and cloud synchronization are not available yet.</p></main><script>
(()=>{const catalog=[{"id":"snake","name":"Snake","genre":"Arcade","url":"/games/snake/"},{"id":"tic-tac-toe","name":"Tic Tac Toe","genre":"Board","url":"/games/tic-tac-toe/"},{"id":"pacman","name":"Pac-Man","genre":"Arcade","url":"/games/pacman/"},{"id":"tetris","name":"Tetris","genre":"Puzzle","url":"/games/tetris/"},{"id":"2048","name":"2048","genre":"Puzzle","url":"/games/2048/"},{"id":"minesweeper","name":"Minesweeper","genre":"Puzzle","url":"/games/minesweeper/"},{"id":"sudoku","name":"Sudoku","genre":"Puzzle","url":"/games/sudoku/"},{"id":"wordle","name":"Wordle","genre":"Word","url":"/games/wordle/"},{"id":"geometrydash","name":"Geometry Dash","genre":"Rhythm","url":"/games/geometrydash/"},{"id":"bowling","name":"Bowling","genre":"Sports","url":"/games/bowling/"}];const list=document.getElementById('list');let ids=[];try{ids=JSON.parse(localStorage.getItem('dms-gaming-library')||'[]')}catch{}function render(){const games=catalog.filter(g=>ids.includes(g.id));if(!games.length){list.innerHTML='<div class="empty">Your library is empty.<br><br><a href="/games/" style="color:#66c0f4">Browse the store and add a game →</a></div>';return}list.innerHTML=games.map(g=>'<article class="row"><div class="art '+g.cls+'">'+g.art+'</div><div><h2>'+g.name+'</h2><p>'+g.genre+'</p></div><div class="actions">'+(g.url?'<a class="btn" href="'+g.url+'">PLAY</a>':'<span class="btn remove">COMING SOON</span>')+'<button class="btn remove" data-remove="'+g.id+'">REMOVE</button></div></article>').join('');list.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{ids=ids.filter(x=>x!==b.dataset.remove);localStorage.setItem('dms-gaming-library',JSON.stringify(ids));render()}))}render()})();
</script></body></html>
